{% extends "base.html" %}
{% block title %}Синхронизация с OZON{% endblock %}
{% block content %}
<h2>Синхронизация продаж с OZON</h2>
<div style="margin-bottom: 20px;">
    <a href="/seller" class="btn-primary" style="display: inline-block; text-decoration: none; padding: 10px 20px;">← Назад</a>
</div>

{% if last_sync %}
<div style="margin-bottom: 15px; padding: 10px; background: #e8f8f5; border: 1px solid #1abc9c; border-radius: 4px;">
    <strong>Последняя синхронизация:</strong> {{ last_sync.synced_at }} (с {{ last_sync.date_from }} по {{ last_sync.date_to }})
</div>
{% endif %}

<form id="sync-form" method="post" action="/seller/sync_ozon">
    <div class="form-group" style="margin-bottom: 15px; max-width: 400px;">
        <label style="font-weight:bold;">Дата с:</label>
        <input type="date" name="date_from" required value="{{ last_sync.date_to if last_sync else today }}" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
    </div>
    <div class="form-group" style="margin-bottom: 15px; max-width: 400px;">
        <label style="font-weight:bold;">Дата по:</label>
        <input type="date" name="date_to" required value="{{ today }}" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
    </div>
    <button type="submit" class="btn-primary" style="background: #2980b9; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">🔄 Загрузить продажи</button>
</form>

<div id="alert-box" style="display:none; margin-top:15px; padding:15px; background:#ffebee; border:1px solid #e74c3c; border-radius:4px; color:#c0392b; max-width: 500px;"></div>
{% endblock %}
