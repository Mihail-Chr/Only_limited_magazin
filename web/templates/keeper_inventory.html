{% extends "base.html" %}
{% block title %}Инвентаризация{% endblock %}
{% block content %}
<h2>Инвентаризация склада</h2>
<div style="margin-bottom: 15px;">
    <a href="/keeper" class="btn-primary" style="display: inline-block; text-decoration: none; padding: 12px 24px; border-radius: 4px; background: #2c3e50; color: white; font-weight: bold; margin-bottom: 20px;">← Вернуться в меню</a>
</div>

<div style="margin-bottom: 15px;">
    <input type="text" id="search-input" placeholder="Поиск по названию или артикулу..." style="width: 100%; max-width: 400px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
</div>

<table id="stock-table">
    <thead>
        <tr>
            <th>Артикул</th>
            <th onclick="sortTable(1)" style="cursor: pointer; user-select: none;">
                Название <span id="sort-name-icon">↕</span>
            </th>
            <th onclick="sortTable(2)" style="cursor: pointer; user-select: none;">
                Платформа <span id="sort-platform-icon">↕</span>
                <select id="platform-filter" onchange="applyFilters()" style="display: block; margin-top: 5px; font-size: 12px; padding: 2px; border-radius: 4px; width: 100%;">
                    <option value="">Все платформы</option>
                    {% for p in platforms %}<option value="{{ p }}">{{ p }}</option>{% endfor %}
                </select>
            </th>
            <th>Склад</th>
            <th>Факт. остаток</th>
        </tr>
    </thead>
    <tbody>
        {% for r in rows %}
        <tr data-offer-id="{{ r['offer_id'] }}" data-original="{{ r['physical_qty'] }}" data-platform="{{ r['platform'] or '' }}">
            <td>{{ r["offer_id"] }}</td>
            <td>{{ r["name"] }}</td>
            <td>{{ r["platform"] or "—" }}</td>
            <td>
                <select class="warehouse-select" data-id="{{ r['id'] }}" style="padding: 4px; border: 1px solid #ccc; border-radius: 4px;">
                    {% for wh in warehouses %}
                    <option value="{{ wh['id'] }}" {% if wh['id'] == r['warehouse_id'] %}selected{% endif %}>{{ wh['name'] }}</option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <input type="number" class="qty-input" value="{{ r['physical_qty'] }}" min="0" style="width:90px;">
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    function applyFilters() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const platformFilter = document.getElementById('platform-filter').value;

        document.querySelectorAll('#stock-table tbody tr').forEach(row => {
            const nameCell = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
            const offerId = row.dataset.offerId.toLowerCase();
            const platform = row.dataset.platform;

            const matchesSearch = nameCell.includes(query) || offerId.includes(query);
            const matchesPlatform = !platformFilter || platform === platformFilter;

            if (matchesSearch && matchesPlatform) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }
    document.getElementById('search-input').addEventListener('input', applyFilters);

    // Изменение склада
    document.querySelectorAll('.warehouse-select').forEach(select => {
        select.addEventListener('change', async function() {
            const productId = this.dataset.id;
            const warehouseId = this.value;
            try {
                const resp = await fetch('/keeper/update_warehouse_inline', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: parseInt(productId), warehouse_id: parseInt(warehouseId) })
                });
                if (resp.ok) {
                    this.style.border = '2px solid #27ae60';
                    setTimeout(() => this.style.border = '1px solid #ccc', 1000);
                } else {
                    this.style.border = '2px solid #e74c3c';
                }
            } catch (e) {
                this.style.border = '2px solid #e74c3c';
            }
        });
    });

    let sortDirection = {};
    let secondarySortColumn = null;

    function sortTable(columnIndex) {
        const table = document.getElementById('stock-table');
        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        
        if (!sortDirection[columnIndex]) {
            sortDirection[columnIndex] = 1;
        } else {
            sortDirection[columnIndex] *= -1;
        }
        const direction = sortDirection[columnIndex];
        
        if (columnIndex === 2) secondarySortColumn = 1;
        else if (columnIndex === 1) secondarySortColumn = 2;
        else secondarySortColumn = null;
        
        rows.sort((a, b) => {
            const getCellText = (row, index) => row.querySelector(`td:nth-child(${index + 1})`).textContent.trim();
            const compare = (valA, valB) => {
                const numA = parseFloat(valA);
                const numB = parseFloat(valB);
                if (!isNaN(numA) && !isNaN(numB)) {
                    return (numA - numB) * direction;
                }
                return valA.localeCompare(valB, 'ru') * direction;
            };
            const result = compare(getCellText(a, columnIndex), getCellText(b, columnIndex));
            if (result !== 0) return result;
            if (secondarySortColumn !== null) {
                return compare(getCellText(a, secondarySortColumn), getCellText(b, secondarySortColumn));
            }
            return 0;
        });
        
        rows.forEach(row => tbody.appendChild(row));
        
        document.getElementById('sort-name-icon').textContent = '↕';
        document.getElementById('sort-platform-icon').textContent = '↕';
        if (columnIndex === 1) document.getElementById('sort-name-icon').textContent = direction === 1 ? '↑' : '↓';
        if (columnIndex === 2) document.getElementById('sort-platform-icon').textContent = direction === 1 ? '↑' : '↓';
    }
</script>
{% endblock %}
