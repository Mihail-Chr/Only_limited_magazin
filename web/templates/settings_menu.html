{% extends "base.html" %}
{% block title %}Настройки{% endblock %}
{% block content %}
<h2>Настройки</h2>
<div style="margin-bottom: 20px;">
    <a href="/" class="btn-primary" style="display: inline-block; text-decoration: none; padding: 12px 24px; border-radius: 4px; background: #2c3e50; color: white; font-weight: bold;">← На главную</a>
</div>

<!-- Загрузка данных + Резервная копия -->
<div style="display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;">

    <!-- Загрузка данных -->
    <div style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; flex: 2; min-width: 400px;">
        <h3>Загрузка данных</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 4px;">Площадка:</label>
                <select id="platform-select" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-width: 150px;">
                    <option value="">— выберите —</option>
                    {% for m in marketplaces %}
                    <option value="{{ m['code'] }}">{{ m['name'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 4px;">Магазин:</label>
                <select id="store-select" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-width: 200px;">
                    <option value="">— выберите площадку —</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-weight: bold; margin-bottom: 4px;">Действие:</label>
                <select id="action-select" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-width: 200px;">
                    <option value="">— выберите —</option>
                    <option value="load_products">Загрузить карточки</option>
                    <option value="load_postings">Загрузить движение товаров</option>
                </select>
            </div>
            <button id="run-action-btn" class="btn-primary" style="background: #27ae60; padding: 10px 20px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer;">▶ Выполнить</button>
        </div>
        <div id="action-result" style="margin-top: 15px; color: #7f8c8d;"></div>
        <div style="margin-top: 15px;">
            <button id="history-btn" class="btn-primary" style="background: #34495e; padding: 8px 16px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer;">📜 История загрузок</button>
        </div>
    </div>

    <!-- Резервная копия -->
    <div style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; flex: 1; min-width: 250px;">
        <h3>Резервная копия</h3>
        <p style="color: #7f8c8d; font-size: 13px; margin-top: 0;">Скачать или восстановить базу данных</p>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <a href="/settings/backup" class="btn-primary" style="display: block; text-align: center; text-decoration: none; background: #27ae60; padding: 10px 20px; border-radius: 4px; color: white; font-weight: bold;">📥 Загрузить</a>

            <div>
                <input type="file" id="restore-file" accept=".sqlite3" style="display: none;" onchange="restoreBackup()">
                <button onclick="document.getElementById('restore-file').click()" class="btn-primary" style="width: 100%; background: #e67e22; padding: 10px 20px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer;">📤 Восстановить</button>
            </div>
        </div>
    </div>
</div>

<!-- Справочники изменения -->
<div style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; max-width: 800px;">
    <h3>Справочники изменения</h3>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <div>
            <select id="ref-type" onchange="updateRefValues()" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-width: 150px;">
                <option value="warehouse">Склады</option>
                <option value="platform">Платформы</option>
                <option value="edition">Издания</option>
                <option value="publisher">Издатели</option>
                <option value="region">Регионы</option>
            </select>
        </div>
        <div>
            <select id="ref-value" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; min-width: 250px;">
                <!-- Заполняется через JS -->
            </select>
        </div>
        <div style="display: flex; gap: 5px;">
            <button onclick="refAction('add')" title="Добавить" class="btn-primary" style="background: #27ae60; padding: 8px 12px; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer;">➕</button>
            <button onclick="refAction('edit')" title="Редактировать" class="btn-primary" style="background: #3498db; padding: 8px 12px; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer;">✏️</button>
            <button onclick="refAction('delete')" title="Удалить" class="btn-primary" style="background: #e74c3c; padding: 8px 12px; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer;">🗑️</button>
        </div>
    </div>
</div>

<script>
    // ========== ЗАГРУЗКА ДАННЫХ ==========
    document.getElementById('platform-select').addEventListener('change', function () {
        const platform = this.value;
        const storeSelect = document.getElementById('store-select');

        if (!platform) {
            storeSelect.innerHTML = '<option value="">— выберите площадку —</option>';
            return;
        }

        fetch(`/settings/stores_by_platform?platform=${platform}`)
            .then(res => res.json())
            .then(data => {
                storeSelect.innerHTML = '<option value="">— выберите магазин —</option>';
                data.stores.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.code;
                    opt.textContent = s.name;
                    storeSelect.appendChild(opt);
                });
            });
    });

    document.getElementById('run-action-btn').addEventListener('click', function () {
        const platform = document.getElementById('platform-select').value;
        const storeCode = document.getElementById('store-select').value;
        const action = document.getElementById('action-select').value;

        if (!platform || !storeCode || !action) {
            alert('Выберите площадку, магазин и действие');
            return;
        }

        const modal = showResultModal('Выполняется...', 'info');
        const fd = new FormData();
        fd.append('platform', platform);
        fd.append('store_code', storeCode);
        fd.append('action', action);

        fetch('/settings/run_action', {method: 'POST', body: fd})
            .then(res => res.json())
            .then(data => {
                modal.remove();
                if (data.ok) {
                    let text = data.message;
                    if (data.stdout) text += '\n\n' + data.stdout;
                    if (data.stderr) text += '\n\nОшибки:\n' + data.stderr;
                    showResultModal(text, 'success');
                } else {
                    showResultModal('Ошибка: ' + data.error, 'error');
                }
            })
            .catch(err => { modal.remove(); showResultModal('Ошибка сети: ' + err.message, 'error'); });
    });

    // ========== ИСТОРИЯ ЗАГРУЗОК ==========
    document.getElementById('history-btn').addEventListener('click', function () {
        fetch('/settings/history')
            .then(res => res.json())
            .then(data => {
                let html = '<table style="width:100%; border-collapse:collapse; font-size:13px; text-align:left;">';
                html += '<tr><th style="padding:8px; border-bottom:2px solid #ddd;">Дата</th><th style="padding:8px; border-bottom:2px solid #ddd;">Тип</th><th style="padding:8px; border-bottom:2px solid #ddd;">Период</th><th style="padding:8px; border-bottom:2px solid #ddd;">Записей</th></tr>';

                if (data.history.length === 0) {
                    html += '<tr><td colspan="4" style="padding:8px; text-align:center; color:#7f8c8d;">История пуста</td></tr>';
                }

                data.history.forEach(h => {
                    const hasNotes = h.notes && h.notes.trim().length > 0;
                    const trStyle = hasNotes ? 'cursor:pointer; background:#f8f9fa;' : '';
                    const trClick = hasNotes ? `onclick="showHistoryDetails('${h.id}')"` : '';

                    html += `<tr id="history-row-${h.id}" style="${trStyle}" ${trClick}>
                        <td style="padding:8px; border-bottom:1px solid #eee;">${h.syncedAt}</td>
                        <td style="padding:8px; border-bottom:1px solid #eee;">${h.syncType}</td>
                        <td style="padding:8px; border-bottom:1px solid #eee;">${h.dateFrom || '—'} - ${h.dateTo || '—'}</td>
                        <td style="padding:8px; border-bottom:1px solid #eee; font-weight:bold;">${h.recordsCount}</td>
                    </tr>`;
                    
                    if (hasNotes) {
                        html += `<tr id="history-details-${h.id}" style="display:none; background:#e8f4f8;">
                            <td colspan="4" style="padding:12px; border-bottom:1px solid #ddd;">
                                <pre style="white-space:pre-wrap; font-size:12px; margin:0;">${h.notes}</pre>
                            </td>
                        </tr>`;
                    }
                });

                html += '</table>';
                showResultModal(html, 'info', 'История загрузок', true);
            })
            .catch(err => showResultModal('Ошибка сети: ' + err.message, 'error'));
    });

    window.showHistoryDetails = function(id) {
        const detailsRow = document.getElementById('history-details-' + id);
        if (detailsRow) {
            detailsRow.style.display = detailsRow.style.display === 'none' ? 'table-row' : 'none';
        }
    }

    // ========== СПРАВОЧНИКИ ==========
    const REF_DATA = {
        warehouse: [{% for w in warehouses %} {id: {{ w.id }}, name: "{{ w.name }}" }, {% endfor %}],
        platform: [{% for p in platforms %} {id: {{ p.platformId }}, name: "{{ p.platformName }} {{ p.platformVersion }}" }, {% endfor %}],
        edition: [{% for e in editions %} {id: {{ e.editionId }}, name: "{{ e.editionName }}" }, {% endfor %}],
        publisher: [{% for p in publishers %} {id: {{ p.publisherId }}, name: "{{ p.publisherName }}" }, {% endfor %}],
        region: [{% for r in regions %} {id: {{ r.regionId }}, name: "{{ r.regionCode }}" }, {% endfor %}]
    };

    function updateRefValues() {
        const type = document.getElementById('ref-type').value;
        const select = document.getElementById('ref-value');
        select.innerHTML = '';
        
        REF_DATA[type].forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = item.name;
            select.appendChild(opt);
        });
    }

    document.addEventListener('DOMContentLoaded', updateRefValues);

    function refAction(action) {
        const type = document.getElementById('ref-type').value;
        const select = document.getElementById('ref-value');
        const selectedId = select.value;
        const selectedName = select.options[select.selectedIndex]?.textContent || '';
        
        if (action === 'add') {
            showRefModal(type, 'Добавить', '', '', '');
        } else if (action === 'edit') {
            if (!selectedId) return;
            showRefModal(type, 'Редактировать', selectedId, selectedName, '');
        } else if (action === 'delete') {
            if (!selectedId) return;
            showConfirmModal(
                `Удалить запись «${selectedName}» из справочника?<br><b>Внимание:</b> если она используется в товарах, удаление будет заблокировано.`,
                () => submitRefDelete(type, selectedId),
                'Удалить', '#e74c3c'
            );
        }
    }

    function showRefModal(type, title, id, currentName, currentVersion) {
        document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000;';
        
        let inputsHtml = '';
        if (type === 'platform') {
            inputsHtml = `
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Название:</label>
                <input type="text" id="ref-input-name" value="${currentName.split(' ')[0] || ''}" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Версия:</label>
                <input type="text" id="ref-input-version" value="${currentName.split(' ')[1] || ''}" style="width:100%; padding:8px; margin-bottom:16px; border:1px solid #ccc; border-radius:4px;">
            `;
        } else if (type === 'region') {
            inputsHtml = `
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Код региона (ISO):</label>
                <input type="text" id="ref-input-name" value="${currentName}" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Полное название:</label>
                <input type="text" id="ref-input-full" value="${currentName}" style="width:100%; padding:8px; margin-bottom:16px; border:1px solid #ccc; border-radius:4px;">
            `;
        } else if (type === 'warehouse') {
            inputsHtml = `
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Название склада:</label>
                <input type="text" id="ref-input-name" value="${currentName}" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Код (опционально, латиницей):</label>
                <input type="text" id="ref-input-code" value="" style="width:100%; padding:8px; margin-bottom:16px; border:1px solid #ccc; border-radius:4px;">
            `;
        } else {
            inputsHtml = `
                <label style="display:block; font-weight:bold; margin-bottom:4px;">Название:</label>
                <input type="text" id="ref-input-name" value="${currentName}" style="width:100%; padding:8px; margin-bottom:16px; border:1px solid #ccc; border-radius:4px;">
            `;
        }

        modal.innerHTML = `
            <div style="background:white; padding:24px; border-radius:8px; max-width:400px; width:90%;">
                <h3 style="margin-top:0;">${title}</h3>
                ${inputsHtml}
                <div style="display:flex; gap:10px; justify-content:flex-end;">
                    <button id="save-btn" class="btn-primary" style="background:#27ae60; padding:10px 20px; border:none; border-radius:4px; color:white; font-weight:bold; cursor:pointer;">Сохранить</button>
                    <button id="cancel-btn" class="btn-primary" style="background:#95a5a6; padding:10px 20px; border:none; border-radius:4px; color:white; font-weight:bold; cursor:pointer;">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        modal.querySelector('#save-btn').addEventListener('click', () => {
            const name = document.getElementById('ref-input-name').value.trim();
            const version = document.getElementById('ref-input-version')?.value.trim();
            const code = document.getElementById('ref-input-code')?.value.trim();
            const full = document.getElementById('ref-input-full')?.value.trim();
            if (!name) return alert('Введите название');
            modal.remove();
            
            if (title === 'Добавить') submitRefAdd(type, name, version, code, full);
            else submitRefEdit(type, id, name, version, full);
        });

        modal.querySelector('#cancel-btn').addEventListener('click', () => modal.remove());
    }

    function submitRefAdd(type, name, version, code, full_name) {
        const fd = new FormData();
        fd.append('item_type', type);
        fd.append('name', name);
        if (version) fd.append('version', version);
        if (code) fd.append('code', code);
        if (full_name) fd.append('full_name', full_name);

        fetch('/settings/add_item', {method: 'POST', body: fd})
            .then(res => res.json())
            .then(data => {
                if (data.ok) { showResultModal('Добавлено', 'success'); setTimeout(() => location.reload(), 800); }
                else showResultModal('Ошибка: ' + data.error, 'error');
            });
    }

    function submitRefEdit(type, id, name, version, full_name) {
        const fd = new FormData();
        fd.append('item_type', type);
        fd.append('item_id', id);
        fd.append('new_value', name);
        if (version) fd.append('new_version', version);

        fetch('/settings/update_item', {method: 'POST', body: fd})
            .then(res => res.json())
            .then(data => {
                if (data.ok) { showResultModal('Обновлено', 'success'); setTimeout(() => location.reload(), 800); }
                else showResultModal('Ошибка: ' + data.error, 'error');
            });
    }

    function submitRefDelete(type, id) {
        const fd = new FormData();
        fd.append('item_type', type);
        fd.append('item_id', id);

        fetch('/settings/delete_item', {method: 'POST', body: fd})
            .then(res => res.json())
            .then(data => {
                if (data.ok) { showResultModal('Удалено', 'success'); setTimeout(() => location.reload(), 800); }
                else showResultModal('Ошибка: ' + data.error, 'error');
            });
    }

    // ========== РЕЗЕРВНАЯ КОПИЯ ==========
    function restoreBackup() {
        const fileInput = document.getElementById('restore-file');
        const file = fileInput.files[0];
        if (!file) return;

        showConfirmModal(
            `Восстановить БД из файла «${file.name}»?<br>Текущая БД будет сохранена как <code>.bak</code>.`,
            () => {
                const fd = new FormData();
                fd.append('file', file);
                const modal = showResultModal('Восстановление...', 'info');
                fetch('/settings/restore', {method: 'POST', body: fd})
                    .then(res => res.json())
                    .then(data => {
                        modal.remove();
                        if (data.ok) { showResultModal(data.message, 'success'); setTimeout(() => location.reload(), 1500); }
                        else showResultModal('Ошибка: ' + data.error, 'error');
                    })
                    .catch(err => { modal.remove(); showResultModal('Ошибка сети: ' + err.message, 'error'); });
            },
            'Восстановить', '#e67e22'
        );
    }

    // ========== МОДАЛКИ ==========
    function showConfirmModal(html, onConfirm, confirmText = 'OK', confirmColor = '#27ae60') {
        document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000;';
        modal.innerHTML = `
            <div style="background:white; padding:24px; border-radius:8px; max-width:500px; width:90%;">
                <h3 style="margin-top:0;">Подтверждение</h3>
                <p style="font-size:16px;">${html}</p>
                <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
                    <button id="confirm-btn" class="btn-primary" style="background:${confirmColor}; padding:10px 20px; border:none; border-radius:4px; color:white; font-weight:bold; cursor:pointer;">${confirmText}</button>
                    <button id="cancel-btn" class="btn-primary" style="background:#95a5a6; padding:10px 20px; border:none; border-radius:4px; color:white; font-weight:bold; cursor:pointer;">Отмена</button>
                </div>
            </div>
        `;
        modal.querySelector('#confirm-btn').addEventListener('click', () => { modal.remove(); onConfirm(); });
        modal.querySelector('#cancel-btn').addEventListener('click', () => modal.remove());
        document.body.appendChild(modal);
    }

    function showResultModal(text, type, title = null, isHtml = false) {
        document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000;';
        
        const color = type === 'error' ? '#e74c3c' : (type === 'success' ? '#27ae60' : '#34495e');
        const defaultTitle = type === 'error' ? 'Ошибка' : (type === 'success' ? 'Успех' : 'Информация');
        const finalTitle = title || defaultTitle;
        
        const contentHtml = isHtml ? `<div style="background:#fff; border:1px solid #ddd; border-radius:4px; overflow-y:auto; max-height:50vh; padding:10px;">${text}</div>` 
                                   : `<pre style="background:#f8f9fa; padding:12px; border-radius:4px; overflow-y:auto; max-height:50vh; white-space:pre-wrap; font-size:13px; margin:0; flex:1;">${text}</pre>`;

        modal.innerHTML = `
            <div style="background:white; padding:24px; border-radius:8px; max-width:800px; width:90%; max-height:85vh; display:flex; flex-direction:column;">
                <h3 style="margin-top:0; color:${color}; margin-bottom: 15px;">${finalTitle}</h3>
                ${contentHtml}
                <div style="margin-top:20px; text-align:right;">
                    <button class="btn-primary" style="background:${color}; padding:10px 24px; border:none; border-radius:4px; color:white; font-weight:bold; cursor:pointer;">ОК</button>
                </div>
            </div>
        `;
        modal.querySelector('button').addEventListener('click', () => modal.remove());
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.remove();
        });
        document.body.appendChild(modal);
        return modal;
    }
</script>
{% endblock %}
